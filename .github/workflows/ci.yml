name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: docker build --target control --tag browser-automation-control:test .
      - run: docker build --target browser-worker --tag browser-automation-browser-worker:test .
      - name: Validate Compose
        env:
          API_KEY: ci-api-key
          POSTGRES_HOST: postgres
          POSTGRES_PORT: 5432
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-password
          REDIS_HOST: redis
          REDIS_PORT: 6379
          REDIS_DB: 0
          REDIS_PASSWORD: ci-redis-password
          AWS_ACCESS_KEY_ID: ci-access-key
          AWS_SECRET_ACCESS_KEY: ci-secret-key
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: browser-automation-control:test
          artifact-name: browser-automation-control.spdx.json
      - name: Scan container
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: browser-automation-control:test
          fail-build: true
          only-fixed: true
          severity-cutoff: high
      - name: Generate worker SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: browser-automation-browser-worker:test
          artifact-name: browser-automation-browser-worker.spdx.json
      - name: Scan worker container
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: browser-automation-browser-worker:test
          fail-build: true
          only-fixed: true
          severity-cutoff: high
