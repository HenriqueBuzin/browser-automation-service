services:
  browser-automation-service:
    build:
      context: .
    image: browser-automation-service:1.61.1
    container_name: browser-automation-service
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    expose:
      - "3000"
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - browser-automation
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"

  selenium-chromium:
    image: selenium/standalone-chromium:4.46.0
    profiles: ["selenium"]
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      SE_NODE_MAX_SESSIONS: "2"
      SE_NODE_SESSION_TIMEOUT: "900"
    expose:
      - "4444"
    networks:
      - browser-automation
    security_opt:
      - no-new-privileges:true

networks:
  browser-automation:
    name: browser-automation
