name: browser-automation-service-dev

x-platform-environment: &platform-environment
  TZ: America/Sao_Paulo
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_USER: ${REDIS_USER:-}
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  ARTIFACT_ROOT: /data/artifacts
  ARTIFACT_BACKEND: ${ARTIFACT_BACKEND:-local}
  S3_BUCKET: ${S3_BUCKET:-browser-artifacts}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
  MAX_ACTIVE_JOBS_PER_CLIENT: ${MAX_ACTIVE_JOBS_PER_CLIENT:-10}
  ARTIFACT_RETENTION_HOURS: ${ARTIFACT_RETENTION_HOURS:-168}

x-platform-service: &platform-service
  labels:
    infra.project: browser-automation-service
    infra.environment: development
    infra.version: ${IMAGE_TAG:-local}
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  environment: *platform-environment
  networks:
    - browser-automation-internal
    - postgres-network
    - redis-network
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  secrets: &platform-secrets
    - postgres_password
    - redis_password
  ulimits:
    core:
      soft: 0
      hard: 0
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  backend:
    <<: *platform-service
    build:
      context: .
      target: control
    image: browser-automation-control:${IMAGE_TAG:-local}
    environment:
      <<: *platform-environment
      API_KEY_FILE: /run/secrets/api_key
      APP_ROLE: api
      BROWSER_SELENIUM_REMOTE_URL: http://selenium-hub:4444/wd/hub
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      SELENIUM_BROWSERS: chromium,firefox,edge
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    networks:
      browser-automation-internal:
      postgres-network:
      redis-network:
      proxy-network:
        aliases:
          - browser-automation-service-dev
      browser-automation-network:
        aliases:
          - browser-automation-service-dev
    volumes:
      - artifacts:/data/artifacts:ro
    secrets:
      - postgres_password
      - redis_password
      - api_key
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 10s
      timeout: 3s
      retries: 10

  dispatcher:
    <<: *platform-service
    image: browser-automation-control:${IMAGE_TAG:-local}
    environment:
      <<: *platform-environment
      APP_ROLE: dispatcher
    volumes:
      - artifacts:/data/artifacts

  worker-playwright:
    <<: *platform-service
    build:
      context: .
      target: browser-worker
    image: browser-automation-browser-worker:${IMAGE_TAG:-local}
    environment:
      <<: *platform-environment
      APP_ROLE: worker
      WORKER_ADAPTER: playwright
      WORKER_CONCURRENCY: ${PLAYWRIGHT_CONCURRENCY:-2}
      WORKER_CAPACITY_UNITS: ${PLAYWRIGHT_CAPACITY_UNITS:-3}
    shm_size: "1gb"
    volumes:
      - artifacts:/data/artifacts
    networks:
      browser-automation-internal:
      postgres-network:
      redis-network:
      browser-automation-network:
        aliases:
          - browser-adapter-playwright-dev

  worker-puppeteer:
    <<: *platform-service
    image: browser-automation-browser-worker:${IMAGE_TAG:-local}
    environment:
      <<: *platform-environment
      APP_ROLE: worker
      WORKER_ADAPTER: puppeteer
      WORKER_CONCURRENCY: ${PUPPETEER_CONCURRENCY:-2}
      WORKER_CAPACITY_UNITS: ${PUPPETEER_CAPACITY_UNITS:-2}
    shm_size: "1gb"
    volumes:
      - artifacts:/data/artifacts
    networks:
      browser-automation-internal:
      postgres-network:
      redis-network:
      browser-automation-network:
        aliases:
          - browser-adapter-puppeteer-dev

  worker-selenium:
    <<: *platform-service
    image: browser-automation-control:${IMAGE_TAG:-local}
    depends_on:
      selenium-hub:
        condition: service_started
    environment:
      <<: *platform-environment
      APP_ROLE: worker
      WORKER_ADAPTER: selenium
      BROWSER_SELENIUM_REMOTE_URL: http://selenium-hub:4444/wd/hub
      SELENIUM_BROWSERS: chromium,firefox,edge
      WORKER_CONCURRENCY: ${SELENIUM_CONCURRENCY:-3}
      WORKER_CAPACITY_UNITS: ${SELENIUM_CAPACITY_UNITS:-3}
    volumes:
      - artifacts:/data/artifacts
    networks:
      browser-automation-internal:
      postgres-network:
      redis-network:
      browser-automation-network:
        aliases:
          - browser-adapter-selenium-dev

  selenium-hub:
    image: selenium/hub:4.46.0
    restart: unless-stopped
    expose: ["4442", "4443", "4444"]
    environment:
      TZ: America/Sao_Paulo
    networks: [browser-automation-internal]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      core: 0

  selenium-chromium:
    image: selenium/node-chromium:4.46.0
    restart: unless-stopped
    depends_on: [selenium-hub]
    shm_size: "1gb"
    environment: &selenium-node-environment
      TZ: America/Sao_Paulo
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: "4442"
      SE_EVENT_BUS_SUBSCRIBE_PORT: "4443"
      SE_NODE_MAX_SESSIONS: "1"
      SE_NODE_SESSION_TIMEOUT: "900"
    networks:
      - browser-automation-internal
      - browser-automation-network
    security_opt: ["no-new-privileges:true"]
    ulimits:
      core: 0

  selenium-firefox:
    image: selenium/node-firefox:4.46.0
    restart: unless-stopped
    depends_on: [selenium-hub]
    shm_size: "1gb"
    environment: *selenium-node-environment
    networks:
      - browser-automation-internal
      - browser-automation-network
    security_opt: ["no-new-privileges:true"]
    ulimits:
      core: 0

  selenium-edge:
    image: selenium/node-edge:4.46.0
    restart: unless-stopped
    depends_on: [selenium-hub]
    shm_size: "1gb"
    environment: *selenium-node-environment
    networks:
      - browser-automation-internal
      - browser-automation-network
    security_opt: ["no-new-privileges:true"]
    ulimits:
      core: 0

volumes:
  artifacts:

networks:
  browser-automation-internal:
    name: browser-automation-internal
  browser-automation-network:
    external: true
    name: ${BROWSER_AUTOMATION_NETWORK:-browser-automation-network}
  postgres-network:
    external: true
    name: ${POSTGRES_NETWORK:-postgres-network}
  redis-network:
    external: true
    name: ${REDIS_NETWORK:-redis-network}
  proxy-network:
    external: true
    name: ${PROXY_NETWORK:-proxy-network}

secrets:
  api_key:
    environment: API_KEY
  postgres_password:
    environment: POSTGRES_PASSWORD
  redis_password:
    environment: REDIS_PASSWORD
